<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundWave - Modern Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --dark-bg: #0f0f1e;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-bg-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent-color: #667eea;
            --accent-hover: #764ba2;
            --border-color: rgba(255, 255, 255, 0.1);
            --success-color: #10b981;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            background: radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(240, 147, 251, 0.1) 0%, transparent 50%),
                        var(--dark-bg);
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            background: rgba(15, 15, 30, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: fit-content;
        }

        .logo span {
            font-size: 1.5rem;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            color: var(--text-primary);
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .search-box input:focus {
            outline: none;
            background: var(--card-bg-hover);
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .theme-toggle:hover {
            background: var(--card-bg-hover);
            transform: rotate(20deg);
        }

        /* MAIN CONTENT */
        .main-content {
            display: flex;
            flex: 1;
            gap: 1.5rem;
            padding: 1.5rem 2rem;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 1.5rem;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .sidebar-section h3 {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .category-list, .playlist-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .category-item, .playlist-item {
            padding: 0.8rem 1rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-item:hover, .playlist-item:hover {
            background: var(--card-bg-hover);
            color: var(--text-primary);
        }

        .category-item.active {
            background: var(--primary-gradient);
            color: var(--text-primary);
            border-color: var(--accent-color);
        }

        .category-icon {
            font-size: 1.1rem;
        }

        .add-playlist-btn {
            background: var(--primary-gradient);
            border: none;
            color: var(--text-primary);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: auto;
            width: 100%;
            font-size: 0.9rem;
        }

        .add-playlist-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        /* CENTER - PLAYER */
        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow: hidden;
        }

        .now-playing-card {
            background: var(--primary-gradient);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            min-height: 300px;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .now-playing-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveGradient 20s linear infinite;
        }

        @keyframes moveGradient {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .album-art-container {
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }

        .album-art {
            width: 180px;
            height: 180px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .song-info {
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .song-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .song-artist {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 1.5rem;
        }

        .song-stats {
            display: flex;
            gap: 2rem;
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .stat-item {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        /* PROGRESS BAR */
        .progress-section {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 0.8rem;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--secondary-gradient);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px rgba(245, 87, 108, 0.5);
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* PLAYER CONTROLS */
        .player-controls {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .control-btn {
            background: var(--card-bg-hover);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .control-btn:hover {
            background: var(--accent-color);
            transform: scale(1.1);
            border-color: var(--accent-color);
        }

        .control-btn.active {
            background: var(--accent-color);
            color: white;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            background: var(--secondary-gradient);
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
        }

        .play-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.6);
        }

        .secondary-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex: 0.3;
        }

        .volume-slider {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            border: none;
        }

        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 0.3rem;
            height: 30px;
        }

        .eq-bar {
            width: 4px;
            background: var(--secondary-gradient);
            border-radius: 2px;
            animation: equalizer 0.6s ease-in-out infinite;
        }

        .eq-bar:nth-child(1) { animation-delay: 0s; height: 60%; }
        .eq-bar:nth-child(2) { animation-delay: 0.1s; height: 80%; }
        .eq-bar:nth-child(3) { animation-delay: 0.2s; height: 100%; }
        .eq-bar:nth-child(4) { animation-delay: 0.1s; height: 80%; }
        .eq-bar:nth-child(5) { animation-delay: 0s; height: 60%; }

        @keyframes equalizer {
            0%, 100% { height: 50%; }
            50% { height: 100%; }
        }

        /* RIGHT SIDEBAR - QUEUE */
        .queue-section {
            width: 320px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 1.5rem;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .queue-header {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .queue-count {
            background: var(--accent-color);
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .queue-list {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .queue-item {
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .queue-item:hover {
            background: var(--card-bg-hover);
            border-left-color: var(--accent-color);
        }

        .queue-item.active {
            background: var(--accent-color);
            border-left-color: var(--accent-color);
            font-weight: 600;
        }

        .queue-item-info {
            flex: 1;
            min-width: 0;
        }

        .queue-item-title {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .queue-item-artist {
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .queue-item-duration {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-left: 0.5rem;
        }

        .favorite-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            padding: 0.2rem;
            margin-left: 0.5rem;
        }

        .favorite-btn:hover {
            color: #ff6b6b;
        }

        .favorite-btn.active {
            color: #ff6b6b;
        }

        /* SCROLLBAR STYLING */
        .sidebar::-webkit-scrollbar,
        .queue-list::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track,
        .queue-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb,
        .queue-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover,
        .queue-list::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .modal-input {
            width: 100%;
            padding: 0.8rem;
            background: var(--card-bg-hover);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
        }

        .modal-buttons button {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .modal-buttons .confirm {
            background: var(--primary-gradient);
            color: var(--text-primary);
        }

        .modal-buttons .cancel {
            background: var(--card-bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .modal-buttons .confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        /* RESPONSIVE */
        @media (max-width: 1400px) {
            .main-content {
                gap: 1rem;
                padding: 1rem;
            }

            .sidebar {
                width: 240px;
            }

            .queue-section {
                width: 280px;
            }

            .now-playing-card {
                padding: 1.5rem;
                min-height: 250px;
            }

            .album-art {
                width: 150px;
                height: 150px;
            }

            .song-title {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 1024px) {
            .main-content {
                flex-direction: column;
            }

            .sidebar, .queue-section {
                width: 100%;
                max-height: 200px;
            }

            .queue-list {
                max-height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">
                <span>🎵</span> SoundWave
            </div>
            <div class="search-box">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor">
                    <circle cx="6.5" cy="6.5" r="5.5"></circle>
                    <path d="M10.5 10.5L15 15"></path>
                </svg>
                <input type="text" id="searchInput" placeholder="Search songs, artists...">
            </div>
            <button class="theme-toggle" title="Theme Toggle">🌙</button>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- LEFT SIDEBAR -->
            <div class="sidebar">
                <div>
                    <h3>Categories</h3>
                    <div class="category-list" id="categoryList"></div>
                </div>
                <div>
                    <h3>Playlists</h3>
                    <div class="playlist-list" id="playlistList"></div>
                    <button class="add-playlist-btn" id="addPlaylistBtn">+ Add Playlist</button>
                </div>
            </div>

            <!-- CENTER - PLAYER -->
            <div class="player-section">
                <!-- NOW PLAYING CARD -->
                <div class="now-playing-card">
                    <div class="album-art-container">
                        <div class="album-art" id="albumArt">♪</div>
                    </div>
                    <div class="song-info">
                        <div class="song-title" id="songTitle">Select a Song</div>
                        <div class="song-artist" id="songArtist">Artist Name</div>
                        <div class="song-stats">
                            <div class="stat-item">
                                <span>📊</span>
                                <span id="genre">Genre</span>
                            </div>
                            <div class="stat-item">
                                <span>🎧</span>
                                <span id="plays">0 plays</span>
                            </div>
                            <div class="stat-item">
                                <span>⭐</span>
                                <span id="rating">0/5</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PROGRESS BAR -->
                <div class="progress-section">
                    <div class="progress-bar-container" id="progressContainer">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <!-- CONTROLS -->
                <div class="player-controls">
                    <div class="controls">
                        <button class="control-btn" id="shuffleBtn" title="Shuffle">🔀</button>
                        <button class="control-btn" id="prevBtn" title="Previous">⏮️</button>
                        <button class="play-btn" id="playBtn" title="Play">▶️</button>
                        <button class="control-btn" id="nextBtn" title="Next">⏭️</button>
                        <button class="control-btn" id="repeatBtn" title="Repeat">🔁</button>
                    </div>
                    <div class="secondary-controls">
                        <div class="equalizer" id="equalizer">
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                        </div>
                        <div class="volume-control">
                            <span>🔊</span>
                            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70">
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT SIDEBAR - QUEUE -->
            <div class="queue-section">
                <div class="queue-header">
                    <span>Up Next</span>
                    <div class="queue-count" id="queueCount">0</div>
                </div>
                <div class="queue-list" id="queueList"></div>
            </div>
        </div>
    </div>

    <!-- ADD PLAYLIST MODAL -->
    <div class="modal" id="playlistModal">
        <div class="modal-content">
            <div class="modal-title">Create Playlist</div>
            <input type="text" id="playlistNameInput" class="modal-input" placeholder="Enter playlist name...">
            <div class="modal-buttons">
                <button class="confirm" id="confirmPlaylist">Create</button>
                <button class="cancel" id="cancelPlaylist">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== MUSIC DATA ====================
        const musicLibrary = [
            // Pop
            { id: 1, title: 'Midnight Dreams', artist: 'Luna Echo', duration: 245, category: 'Pop', emoji: '🎤', plays: 1250, rating: 4.8 },
            { id: 2, title: 'Electric Heartbeat', artist: 'Neon Vibes', duration: 215, category: 'Pop', emoji: '⚡', plays: 892, rating: 4.5 },
            { id: 3, title: 'Summer Nights', artist: 'Bright Pulse', duration: 198, category: 'Pop', emoji: '☀️', plays: 2156, rating: 4.9 },
            
            // Rock
            { id: 4, title: 'Thunder Road', artist: 'Stone Echo', duration: 287, category: 'Rock', emoji: '🎸', plays: 1567, rating: 4.7 },
            { id: 5, title: 'Burning Sky', artist: 'Rage Storm', duration: 312, category: 'Rock', emoji: '🔥', plays: 934, rating: 4.3 },
            { id: 6, title: 'Ancient Runes', artist: 'Mountain Kings', duration: 256, category: 'Rock', emoji: '🏔️', plays: 1203, rating: 4.6 },
            
            // Jazz
            { id: 7, title: 'Smooth Jazz Evening', artist: 'Blue Notes', duration: 289, category: 'Jazz', emoji: '🎷', plays: 756, rating: 4.8 },
            { id: 8, title: 'Midnight Serenade', artist: 'Jazz Masters', duration: 267, category: 'Jazz', emoji: '🌙', plays: 1089, rating: 4.9 },
            { id: 9, title: 'Urban Groove', artist: 'City Rhythms', duration: 234, category: 'Jazz', emoji: '🏙️', plays: 645, rating: 4.4 },
            
            // Electronic
            { id: 10, title: 'Synthetic Reality', artist: 'Digital Dreams', duration: 278, category: 'Electronic', emoji: '🤖', plays: 2345, rating: 4.7 },
            { id: 11, title: 'Cyber Pulse', artist: 'Tech Waves', duration: 256, category: 'Electronic', emoji: '💻', plays: 1876, rating: 4.5 },
            { id: 12, title: 'Digital Horizon', artist: 'Future Sound', duration: 302, category: 'Electronic', emoji: '🌐', plays: 1543, rating: 4.6 },
            
            // Hip-Hop
            { id: 13, title: 'Street Chronicles', artist: 'Urban Flow', duration: 234, category: 'Hip-Hop', emoji: '🎙️', plays: 2876, rating: 4.8 },
            { id: 14, title: 'Rhythm and Beats', artist: 'Beat Masters', duration: 267, category: 'Hip-Hop', emoji: '🥁', plays: 1654, rating: 4.6 },
            { id: 15, title: 'Microphone Fire', artist: 'Lyrical Genius', duration: 243, category: 'Hip-Hop', emoji: '🔥', plays: 1923, rating: 4.7 },
            
            // Classical
            { id: 16, title: 'Symphony No.9', artist: 'Orchestra Ensemble', duration: 456, category: 'Classical', emoji: '🎻', plays: 1234, rating: 4.9 },
            { id: 17, title: 'Piano Sonata', artist: 'Classical Maestro', duration: 389, category: 'Classical', emoji: '🎹', plays: 876, rating: 4.8 },
            { id: 18, title: 'Chamber Music', artist: 'String Quartet', duration: 312, category: 'Classical', emoji: '🎼', plays: 654, rating: 4.7 },
        ];

        // ==================== STATE MANAGEMENT ====================
        const state = {
            currentSongIndex: 0,
            isPlaying: false,
            currentTime: 0,
            volume: 70,
            shuffleEnabled: false,
            repeatMode: 0, // 0: no repeat, 1: repeat all, 2: repeat one
            currentCategory: 'All',
            currentPlaylist: null,
            playlists: JSON.parse(localStorage.getItem('playlists')) || [],
            favorites: JSON.parse(localStorage.getItem('favorites')) || [],
            queue: [],
            filteredSongs: [...musicLibrary],
        };

        // ==================== DOM ELEMENTS ====================
        const elements = {
            playBtn: document.getElementById('playBtn'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            shuffleBtn: document.getElementById('shuffleBtn'),
            repeatBtn: document.getElementById('repeatBtn'),
            volumeSlider: document.getElementById('volumeSlider'),
            progressBar: document.getElementById('progressBar'),
            progressContainer: document.getElementById('progressContainer'),
            currentTime: document.getElementById('currentTime'),
            duration: document.getElementById('duration'),
            songTitle: document.getElementById('songTitle'),
            songArtist: document.getElementById('songArtist'),
            albumArt: document.getElementById('albumArt'),
            genre: document.getElementById('genre'),
            plays: document.getElementById('plays'),
            rating: document.getElementById('rating'),
            searchInput: document.getElementById('searchInput'),
            categoryList: document.getElementById('categoryList'),
            playlistList: document.getElementById('playlistList'),
            queueList: document.getElementById('queueList'),
            queueCount: document.getElementById('queueCount'),
            addPlaylistBtn: document.getElementById('addPlaylistBtn'),
            playlistModal: document.getElementById('playlistModal'),
            playlistNameInput: document.getElementById('playlistNameInput'),
            confirmPlaylist: document.getElementById('confirmPlaylist'),
            cancelPlaylist: document.getElementById('cancelPlaylist'),
            themeToggle: document.querySelector('.theme-toggle'),
        };

        // ==================== INITIALIZATION ====================
        function init() {
            renderCategories();
            renderPlaylists();
            initializeQueue();
            updateSongDisplay();
            setupEventListeners();
            elements.volumeSlider.value = state.volume;
        }

        // ==================== EVENT LISTENERS ====================
        function setupEventListeners() {
            // Player controls
            elements.playBtn.addEventListener('click', togglePlay);
            elements.prevBtn.addEventListener('click', previousSong);
            elements.nextBtn.addEventListener('click', nextSong);
            elements.shuffleBtn.addEventListener('click', toggleShuffle);
            elements.repeatBtn.addEventListener('click', toggleRepeat);
            
            // Volume
            elements.volumeSlider.addEventListener('input', handleVolumeChange);
            
            // Progress
            elements.progressContainer.addEventListener('click', handleProgressClick);
            
            // Search
            elements.searchInput.addEventListener('input', handleSearch);
            
            // Playlist modal
            elements.addPlaylistBtn.addEventListener('click', openPlaylistModal);
            elements.confirmPlaylist.addEventListener('click', createPlaylist);
            elements.cancelPlaylist.addEventListener('click', closePlaylistModal);
            elements.playlistModal.addEventListener('click', (e) => {
                if (e.target === elements.playlistModal) closePlaylistModal();
            });

            // Theme
            elements.themeToggle.addEventListener('click', toggleTheme);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && e.target === document.body) {
                    e.preventDefault();
                    togglePlay();
                }
            });

            // Simulation of time progress (since we can't actually play audio)
            setInterval(() => {
                if (state.isPlaying && state.queue.length > 0) {
                    state.currentTime += 0.1;
                    const currentSong = state.queue[state.currentSongIndex];
                    if (state.currentTime >= currentSong.duration) {
                        nextSong();
                    }
                    updateProgressBar();
                }
            }, 100);
        }

        // ==================== CATEGORY FUNCTIONS ====================
        function renderCategories() {
            const categories = ['All', ...new Set(musicLibrary.map(song => song.category))];
            elements.categoryList.innerHTML = categories.map(cat => 
                `<div class="category-item ${state.currentCategory === cat ? 'active' : ''}" data-category="${cat}">
                    <span class="category-icon">${getCategoryIcon(cat)}</span>
                    <span>${cat}</span>
                </div>`
            ).join('');

            elements.categoryList.addEventListener('click', (e) => {
                const item = e.target.closest('.category-item');
                if (item) {
                    document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    state.currentCategory = item.dataset.category;
                    filterSongs();
                }
            });
        }

        function getCategoryIcon(category) {
            const icons = {
                'All': '🎵',
                'Pop': '🎤',
                'Rock': '🎸',
                'Jazz': '🎷',
                'Electronic': '🤖',
                'Hip-Hop': '🎙️',
                'Classical': '🎻',
            };
            return icons[category] || '♪';
        }

        // ==================== SEARCH & FILTER ====================
        function handleSearch(e) {
            const query = e.target.value.toLowerCase();
            state.filteredSongs = musicLibrary.filter(song => 
                (state.currentCategory === 'All' || song.category === state.currentCategory) &&
                (song.title.toLowerCase().includes(query) || 
                 song.artist.toLowerCase().includes(query))
            );
            initializeQueue();
            updateSongDisplay();
        }

        function filterSongs() {
            state.filteredSongs = state.currentCategory === 'All' 
                ? [...musicLibrary]
                : musicLibrary.filter(song => song.category === state.currentCategory);
            initializeQueue();
            updateSongDisplay();
        }

        // ==================== QUEUE FUNCTIONS ====================
        function initializeQueue() {
            state.queue = [...state.filteredSongs];
            state.currentSongIndex = 0;
            updateQueueDisplay();
        }

        function updateQueueDisplay() {
            elements.queueCount.textContent = state.queue.length;
            elements.queueList.innerHTML = state.queue.map((song, index) => {
                const isFavorite = state.favorites.includes(song.id);
                return `
                    <div class="queue-item ${index === state.currentSongIndex ? 'active' : ''}" data-song-id="${song.id}">
                        <div class="queue-item-info">
                            <div class="queue-item-title">${song.title}</div>
                            <div class="queue-item-artist">${song.artist}</div>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span class="queue-item-duration">${formatTime(song.duration)}</span>
                            <button class="favorite-btn ${isFavorite ? 'active' : ''}" data-song-id="${song.id}">
                                ${isFavorite ? '❤️' : '🤍'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // Queue item click
            elements.queueList.addEventListener('click', (e) => {
                const item = e.target.closest('.queue-item');
                if (item && !e.target.closest('.favorite-btn')) {
                    const songId = parseInt(item.dataset.songId);
                    state.currentSongIndex = state.queue.findIndex(s => s.id === songId);
                    state.currentTime = 0;
                    updateSongDisplay();
                    updateQueueDisplay();
                }
            });

            // Favorite button click
            elements.queueList.addEventListener('click', (e) => {
                const favBtn = e.target.closest('.favorite-btn');
                if (favBtn) {
                    const songId = parseInt(favBtn.dataset.songId);
                    toggleFavorite(songId);
                }
            });
        }

        function toggleFavorite(songId) {
            if (state.favorites.includes(songId)) {
                state.favorites = state.favorites.filter(id => id !== songId);
            } else {
                state.favorites.push(songId);
            }
            localStorage.setItem('favorites', JSON.stringify(state.favorites));
            updateQueueDisplay();
        }

        // ==================== PLAYLIST FUNCTIONS ====================
        function renderPlaylists() {
            elements.playlistList.innerHTML = state.playlists.map((playlist, index) => 
                `<div class="playlist-item" data-playlist-index="${index}">
                    <span class="category-icon">📋</span>
                    <span>${playlist.name} (${playlist.songs.length})</span>
                </div>`
            ).join('');

            elements.playlistList.addEventListener('click', (e) => {
                const item = e.target.closest('.playlist-item');
                if (item) {
                    state.currentPlaylist = parseInt(item.dataset.playlistIndex);
                    state.queue = [...state.playlists[state.currentPlaylist].songs];
                    state.currentSongIndex = 0;
                    state.currentTime = 0;
                    updateSongDisplay();
                    updateQueueDisplay();
                }
            });
        }

        function openPlaylistModal() {
            elements.playlistModal.classList.add('active');
            elements.playlistNameInput.focus();
        }

        function closePlaylistModal() {
            elements.playlistModal.classList.remove('active');
            elements.playlistNameInput.value = '';
        }

        function createPlaylist() {
            const name = elements.playlistNameInput.value.trim();
            if (name) {
                state.playlists.push({
                    name,
                    songs: state.currentSongIndex < state.queue.length ? [state.queue[state.currentSongIndex]] : []
                });
                localStorage.setItem('playlists', JSON.stringify(state.playlists));
                renderPlaylists();
                closePlaylistModal();
            }
        }

        // ==================== PLAYER FUNCTIONS ====================
        function togglePlay() {
            state.isPlaying = !state.isPlaying;
            updatePlayButton();
        }

        function updatePlayButton() {
            elements.playBtn.textContent = state.isPlaying ? '⏸️' : '▶️';
            elements.playBtn.title = state.isPlaying ? 'Pause' : 'Play';
        }

        function previousSong() {
            state.currentSongIndex = state.currentSongIndex === 0 ? state.queue.length - 1 : state.currentSongIndex - 1;
            state.currentTime = 0;
            state.isPlaying = true;
            updateSongDisplay();
            updateQueueDisplay();
            updatePlayButton();
        }

        function nextSong() {
            if (state.repeatMode === 2) {
                state.currentTime = 0;
            } else {
                state.currentSongIndex = (state.currentSongIndex + 1) % state.queue.length;
                state.currentTime = 0;
            }
            state.isPlaying = true;
            updateSongDisplay();
            updateQueueDisplay();
            updatePlayButton();
        }

        function toggleShuffle() {
            state.shuffleEnabled = !state.shuffleEnabled;
            elements.shuffleBtn.classList.toggle('active', state.shuffleEnabled);
            
            if (state.shuffleEnabled) {
                const currentSong = state.queue[state.currentSongIndex];
                const remaining = state.queue.filter((_, i) => i !== state.currentSongIndex);
                for (let i = remaining.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
                }
                state.queue = [currentSong, ...remaining];
                state.currentSongIndex = 0;
            } else {
                filterSongs();
            }
            updateQueueDisplay();
        }

        function toggleRepeat() {
            state.repeatMode = (state.repeatMode + 1) % 3;
            const icons = ['🔁', '🔂', '🔃'];
            elements.repeatBtn.textContent = icons[state.repeatMode];
            elements.repeatBtn.classList.toggle('active', state.repeatMode > 0);
        }

        function handleVolumeChange(e) {
            state.volume = e.target.value;
        }

        function handleProgressClick(e) {
            const rect = elements.progressContainer.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            const song = state.queue[state.currentSongIndex];
            if (song) {
                state.currentTime = percent * song.duration;
                updateProgressBar();
            }
        }

        function updateProgressBar() {
            const song = state.queue[state.currentSongIndex];
            if (song) {
                const percent = (state.currentTime / song.duration) * 100;
                elements.progressBar.style.width = percent + '%';
                elements.currentTime.textContent = formatTime(state.currentTime);
                elements.duration.textContent = formatTime(song.duration);
            }
        }

        function updateSongDisplay() {
            const song = state.queue[state.currentSongIndex];
            if (song) {
                elements.songTitle.textContent = song.title;
                elements.songArtist.textContent = song.artist;
                elements.albumArt.textContent = song.emoji;
                elements.genre.textContent = song.category;
                elements.plays.textContent = song.plays.toLocaleString() + ' plays';
                elements.rating.textContent = song.rating + '/5';
                state.currentTime = 0;
                updateProgressBar();
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // ==================== THEME ====================
        function toggleTheme() {
            document.body.style.filter = document.body.style.filter === 'invert(1)' ? 'none' : 'invert(1)';
            elements.themeToggle.textContent = document.body.style.filter === 'invert(1)' ? '☀️' : '🌙';
        }

        // ==================== START ====================
        init();
    </script>
</body>
</html>
